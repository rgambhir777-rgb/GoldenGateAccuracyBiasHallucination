[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldengate"
version = "1.0.0"
description = "GoldenGate - Accuracy, Hallucination & Bias Regression Suite for RAG systems"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "GoldenGate maintainers" }]
dependencies = [
    "pydantic==2.14.2",
    "typer==0.27.3",
    "rich==15.0.0",
    "sqlalchemy==2.1.8",
    "rapidfuzz==3.14.6",
    "numpy==2.4.6",
    "rank-bm25==0.2.2",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "jinja2==3.1.6",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "anthropic==2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]
build = [
    "pyinstaller==6.22.3",
]

[project.scripts]
goldengate = "goldengate.cli.main:app"

[tool.setuptools.packages.find]
include = ["goldengate*"]

[tool.setuptools.package-data]
goldengate = ["systems/prompts/*.md", "reports/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q"

[tool.coverage.run]
source = ["goldengate"]
omit = ["goldengate/server/launcher.py"]

[tool.coverage.report]
show_missing = false
skip_covered = false
